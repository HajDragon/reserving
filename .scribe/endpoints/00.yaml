      groupName: Products API
      groupDescription: "RESTful API for managing Experience Lab equipment products. Supports filtering, sorting, and pagination."
      subgroup: ""
      subgroupDescription: ""
      title: List all products
      description: "Returns a paginated list of products. Supports partial-match filtering on asset_tag, name, and type, exact filtering on is_active, and sorting by any field. Default sort is newest first. Requires the products.read ability."
      authenticated: true
      deprecated: false
    headers:
      Authorization: "Bearer {YOUR_SANCTUM_TOKEN}"
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      "filter[asset_tag]":
        name: "filter[asset_tag]"
        description: "Partial-match filter on the product asset tag."
        required: false
        example: "EL-CAM-"
        type: string
      "filter[name]":
        name: "filter[name]"
        description: "Partial-match filter on the product name."
        required: false
        example: "Canon"
        type: string
      "filter[type]":
        name: "filter[type]"
        description: "Partial-match filter on the product type/category."
        required: false
        example: "Camera"
        type: string
      "filter[is_active]":
        name: "filter[is_active]"
        description: "Exact filter on active status (true/false)."
        required: false
        example: "true"
        type: boolean
      sort:
        name: sort
        description: "Field to sort by. Prefix with - for descending. Allowed: id, asset_tag, name, type, quantity, available_quantity, created_at, updated_at."
        required: false
        example: "-created_at"
        type: string
      per_page:
        name: per_page
        description: "Number of results per page (default: 15)."
        required: false
        example: "20"
        type: integer
    cleanQueryParameters:
      "filter[asset_tag]": "EL-CAM-"
      "filter[name]": "Canon"
      "filter[type]": "Camera"
      "filter[is_active]": "true"
      sort: "-created_at"
      per_page: "20"
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":[{"id":1,"asset_tag":"EL-CAM-001","name":"Canon EOS R50","description":"System camera","category":"Camera","quantity":5,"available_quantity":3,"is_active":true,"photo_url":"https://example.com/canon.jpg","external_link":null,"created_at":"2026-04-15T14:20:23.000000Z","updated_at":"2026-04-15T14:20:23.000000Z"}],"links":{"first":"http://localhost/api/products?page=1","last":"http://localhost/api/products?page=1","prev":null,"next":null},"meta":{"current_page":1,"from":1,"last_page":1,"per_page":15,"total":1}}'
